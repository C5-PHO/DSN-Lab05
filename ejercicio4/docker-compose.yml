services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    image: node:18-alpine
    ports:
      - "${APP_PORT}:3000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      NODE_ENV: ${APP_ENV}
    depends_on:
      db:
        condition: service_healthy
    command:
      - node
      - -e
      - |
        console.log('App lista, DB healthy:', process.env.DB_HOST);
        require('http').createServer((_req, res) => res.end('OK\n')).listen(3000);
